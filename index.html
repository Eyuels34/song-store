<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Supabase Audio Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-32">

  <!-- HEADER & NAVBAR -->
  <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-40 px-6 py-4 backdrop-blur-md">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-black text-lg">
          ♪
        </div>
        <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 to-purple-300 bg-clip-text text-transparent">
          Audio Vault
        </h1>
      </div>

      <!-- Live Search Bar -->
      <div class="w-full sm:w-72">
        <input 
          type="text" 
          id="search-input" 
          oninput="filterSongs()" 
          placeholder="Search by title or artist..." 
          class="w-full bg-slate-800 border border-slate-700/80 rounded-full px-4 py-2 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition-all"
        >
      </div>
    </div>
  </header>

  <!-- MAIN CATALOG CONTENT -->
  <main class="max-w-7xl mx-auto p-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-8 gap-4">
      <div>
        <h2 class="text-2xl font-black">All Tracks</h2>
        <p class="text-xs text-slate-400">Stream or download audio directly from Supabase Storage.</p>
      </div>

      <!-- Genre Filter -->
      <select id="genre-filter" onchange="filterSongs()" class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs font-semibold text-slate-300 focus:outline-none focus:border-indigo-500">
        <option value="ALL">All Genres</option>
      </select>
    </div>

    <!-- Dynamic Songs Grid -->
    <div id="songs-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <p class="text-slate-500 text-xs col-span-full">Connecting to Supabase...</p>
    </div>
  </main>

  <!-- PERSISTENT BOTTOM PLAYER -->
  <div id="player-bar" class="hidden fixed bottom-0 inset-x-0 bg-slate-900/95 border-t border-slate-800/80 p-4 z-50 backdrop-blur-xl shadow-2xl">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      
      <!-- Currently Playing Metadata -->
      <div class="flex items-center space-x-3 w-full sm:w-1/3">
        <img id="player-cover" src="" class="w-12 h-12 rounded-xl object-cover bg-slate-800 border border-slate-700/50">
        <div class="min-w-0">
          <h4 id="player-title" class="font-bold text-sm text-white truncate">Track Title</h4>
          <p id="player-artist" class="text-xs text-slate-400 truncate">Artist Name</p>
        </div>
      </div>

      <!-- HTML5 Audio Controls -->
      <div class="w-full sm:w-2/3">
        <audio id="main-audio" controls autoplay class="w-full rounded-lg"></audio>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. SUPABASE CREDENTIALS CONFIGURATION
    // ==========================================
    const SUPABASE_URL = "https://itbwruwdmmkedvvfxjsc.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0YndydXdkbW1rZWR2dmZ4anNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MTYwMjYsImV4cCI6MjEwNjE5MjAyNn0.MkxWwr2ve_t7ZmiUnTG_UzQgMuMqJnGbtOXhIvKzlWg";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let allSongs = [];

    // Fetch songs on startup
    window.addEventListener('DOMContentLoaded', fetchSongs);

    // ==========================================
    // 2. FETCH AUDIO RECORDS FROM SUPABASE
    // ==========================================
    async function fetchSongs() {
      const grid = document.getElementById('songs-grid');

      try {
        const { data: songs, error } = await db
          .from('songs')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!songs || songs.length === 0) {
          grid.innerHTML = `
            <div class="col-span-full text-center py-12 border border-dashed border-slate-800 rounded-3xl">
              <p class="text-slate-400 text-sm font-semibold">No audio files found in database.</p>
              <p class="text-xs text-slate-600 mt-1">Make sure you uploaded records to the "songs" table.</p>
            </div>`;
          return;
        }

        allSongs = songs;
        populateGenres(songs);
        renderSongs(songs);
      } catch (err) {
        console.error('Fetch error:', err);
        grid.innerHTML = `<p class="text-rose-400 text-xs col-span-full">Failed to load audio tracks: ${err.message}</p>`;
      }
    }

    // ==========================================
    // 3. RENDER TRACK CARDS
    // ==========================================
    function renderSongs(songs) {
      const grid = document.getElementById('songs-grid');
      
      if (songs.length === 0) {
        grid.innerHTML = '<p class="text-slate-500 text-xs col-span-full">No matching tracks found.</p>';
        return;
      }

      grid.innerHTML = songs.map(song => {
        const cover = song.cover_url || 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17';
        return `
          <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-4 flex flex-col justify-between hover:border-indigo-500/40 transition-all duration-200">
            <div>
              <div class="relative aspect-square rounded-xl overflow-hidden mb-3 bg-slate-800">
                <img src="${cover}" alt="${song.title}" class="w-full h-full object-cover">
                ${song.genre ? `<span class="absolute bottom-2 left-2 bg-slate-950/80 backdrop-blur-md text-slate-300 font-bold text-[10px] px-2 py-0.5 rounded-md border border-slate-800">${song.genre}</span>` : ''}
              </div>
              <h3 class="font-bold text-slate-100 text-sm truncate">${song.title}</h3>
              <p class="text-xs text-slate-400 truncate">${song.artist}</p>
            </div>

            <div class="mt-4 pt-3 border-t border-slate-800/60 flex items-center justify-between">
              <button 
                onclick="playTrack('${escapeQuotes(song.title)}', '${escapeQuotes(song.artist)}', '${cover}', '${song.audio_url}')" 
                class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl transition-all shadow-md hover:shadow-indigo-500/20"
              >
                Play
              </button>
              
              <a 
                href="${song.audio_url}" 
                download 
                target="_blank" 
                class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-slate-700/60 transition-all"
              >
                Download
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    // ==========================================
    // 4. AUDIO PLAYER CONTROLLER
    // ==========================================
    function playTrack(title, artist, cover, url) {
      document.getElementById('player-title').innerText = title;
      document.getElementById('player-artist').innerText = artist;
      document.getElementById('player-cover').src = cover;

      const audio = document.getElementById('main-audio');
      audio.src = url;
      
      document.getElementById('player-bar').classList.remove('hidden');
    }

    // ==========================================
    // 5. SEARCH & FILTERING LOGIC
    // ==========================================
    function populateGenres(songs) {
      const genres = ['ALL', ...new Set(songs.map(s => s.genre).filter(Boolean))];
      const select = document.getElementById('genre-filter');
      select.innerHTML = genres.map(g => `<option value="${g}">${g}</option>`).join('');
    }

    function filterSongs() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const selectedGenre = document.getElementById('genre-filter').value;

      const filtered = allSongs.filter(song => {
        const matchesSearch = song.title.toLowerCase().includes(query) || song.artist.toLowerCase().includes(query);
        const matchesGenre = selectedGenre === 'ALL' || song.genre === selectedGenre;
        return matchesSearch && matchesGenre;
      });

      renderSongs(filtered);
    }

    function escapeQuotes(str) {
      return (str || '').replace(/'/g, "\\'");
    }
  </script>
</body>
</html>
